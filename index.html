<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PortLogistics IoT · Planificador</title>
    <meta name="description" content="Planificador de entregables y sprints del proyecto PortLogistics IoT - Universidad Agustiniana.">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="topbar">
        <div class="marca">
            <div class="marca-logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="5" r="2"/>
                    <path d="M12 7v14M8 11h8M4.5 14.5c.4 3.4 3.6 6.5 7.5 6.5s7.1-3.1 7.5-6.5"/>
                </svg>
            </div>
            <div>
                <strong>PortLogistics IoT</strong>
                <small>Uniagustiniana · Corte 3</small>
            </div>
        </div>
        <label class="busqueda">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
            <input id="busqueda" type="search" placeholder="Buscar incidencia, documento o sprint" aria-label="Buscar">
        </label>
        <div class="topbar-acciones">
            <button class="btn" id="btn-restablecer" type="button">Restablecer</button>
        </div>
    </header>

    <div class="layout">
        <nav class="sidebar" aria-label="Secciones del planificador">
            <p class="seccion">Planificación</p>
            <button class="nav-btn activo" data-vista="tablero" type="button">
                <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg>
                Tablero
            </button>
            <button class="nav-btn" data-vista="backlog" type="button">
                <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
                Backlog
                <span class="badge" id="badge-backlog">0</span>
            </button>
            <button class="nav-btn" data-vista="sprints" type="button">
                <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13"/><path d="M17 10l3 2-3 2"/></svg>
                Sprints
            </button>
            <p class="seccion">Repositorio</p>
            <button class="nav-btn" data-vista="documentos" type="button">
                <svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>
                Documentos
            </button>
            <div class="sidebar-pie">
                Nicolás López Barrera<br>
                Oscar Javier Preciado Tafur<br>
                Juan David Torres Uyazan
            </div>
        </nav>
        <main class="contenido" id="vista"></main>
    </div>

    <script src="js/catalogo.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
